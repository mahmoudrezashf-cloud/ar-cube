<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AR Cube Image Tracking</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #arButton {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;

      padding: 14px 24px;
      font-size: 18px;

      border: none;
      border-radius: 8px;

      background: white;
      color: black;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 10;

      padding: 10px 15px;

      background: rgba(0,0,0,0.7);
      color: white;

      border-radius: 6px;

      font-size: 14px;

      display: none;
    }
  </style>
</head>

<body>

<button id="arButton">START AR</button>

<div id="status"></div>

<script type="module">

import * as THREE from
"https://unpkg.com/three@0.160.0/build/three.module.js";

import { GLTFLoader } from
"https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";


// ==================================================
// Scene
// ==================================================

const scene = new THREE.Scene();


// ==================================================
// Camera
// ==================================================

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.01,
  100
);


// ==================================================
// Renderer
// ==================================================

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true
});

renderer.setPixelRatio(
  window.devicePixelRatio
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.xr.enabled = true;

document.body.appendChild(
  renderer.domElement
);


// ==================================================
// Lights
// ==================================================

const hemisphereLight =
  new THREE.HemisphereLight(
    0xffffff,
    0xbbbbff,
    2
  );

scene.add(
  hemisphereLight
);


const directionalLight =
  new THREE.DirectionalLight(
    0xffffff,
    2
  );

directionalLight.position.set(
  2,
  4,
  3
);

scene.add(
  directionalLight
);


// ==================================================
// Load Cube
// ==================================================

let cube = null;

const loader =
  new GLTFLoader();


loader.load(

  "./ar-cube.glb",

  function(gltf) {

    cube =
      gltf.scene;

    cube.scale.set(
      0.5,
      0.5,
      0.5
    );

    cube.visible =
      false;

    scene.add(
      cube
    );

    console.log(
      "AR CUBE LOADED"
    );

  },

  undefined,

  function(error) {

    console.error(
      "GLB ERROR:",
      error
    );

  }

);


// ==================================================
// Target Image
// ==================================================

const targetImage =
  new Image();

targetImage.src =
  "./target.jpeg";


// ==================================================
// UI
// ==================================================

const button =
  document.getElementById(
    "arButton"
  );

const status =
  document.getElementById(
    "status"
  );


function showStatus(text) {

  status.innerText =
    text;

  status.style.display =
    "block";

}


// ==================================================
// START AR
// ==================================================

button.addEventListener(
  "click",
  async function() {

    try {

      // ----------------------------------------------
      // Check WebXR
      // ----------------------------------------------

      if (!navigator.xr) {

        showStatus(
          "WebXR is not available"
        );

        return;

      }


      // ----------------------------------------------
      // Check AR
      // ----------------------------------------------

      const arSupported =
        await navigator.xr.isSessionSupported(
          "immersive-ar"
        );


      if (!arSupported) {

        showStatus(
          "Immersive AR is not supported"
        );

        return;

      }


      // ----------------------------------------------
      // Load Target
      // ----------------------------------------------

      await targetImage.decode();


      const imageBitmap =
        await createImageBitmap(
          targetImage
        );


      // ----------------------------------------------
      // Start WebXR
      // ----------------------------------------------

      const session =
        await navigator.xr.requestSession(
          "immersive-ar",
          {

            requiredFeatures: [
              "image-tracking"
            ],

            trackedImages: [

              {
                image:
                  imageBitmap,

                // REAL target width:
                // 10 centimeters

                widthInMeters:
                  0.10
              }

            ]

          }
        );


      // ----------------------------------------------
      // WebXR Reference Space
      // ----------------------------------------------

      renderer.xr.setReferenceSpaceType(
        "local"
      );


      await renderer.xr.setSession(
        session
      );


      showStatus(
        "Target را جلوی دوربین بگیر"
      );


      // ----------------------------------------------
      // AR LOOP
      // ----------------------------------------------

      renderer.setAnimationLoop(
        function(time, frame) {

          if (
            frame &&
            cube
          ) {

            const referenceSpace =
              renderer.xr.getReferenceSpace();


            const trackingResults =
              frame.getImageTrackingResults();


            for (
              const result of trackingResults
            ) {

              // Our target = index 0

              if (
                result.index !== 0
              ) {

                continue;

              }


              const pose =
                frame.getPose(
                  result.imageSpace,
                  referenceSpace
                );


              if (!pose) {

                continue;

              }


              // --------------------------------------
              // Place Cube
              // --------------------------------------

              cube.position.set(
                pose.transform.position.x,
                pose.transform.position.y,
                pose.transform.position.z
              );


              cube.quaternion.copy(
                pose.transform.orientation
              );


              cube.visible =
                true;


              showStatus(
                "Target detected"
              );

            }

          }


          renderer.render(
            scene,
            camera
          );

        }
      );


      // ----------------------------------------------
      // End AR
      // ----------------------------------------------

      session.addEventListener(
        "end",
        function() {

          renderer.setAnimationLoop(
            null
          );


          if (cube) {

            cube.visible =
              false;

          }


          status.style.display =
            "none";

        }
      );


    }

    catch(error) {

      console.error(
        "AR ERROR:",
        error
      );


      showStatus(
        "Image Tracking روی این مرورگر پشتیبانی نمی‌شود"
      );

    }

  }
);


// ==================================================
// Resize
// ==================================================

window.addEventListener(
  "resize",
  function() {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
